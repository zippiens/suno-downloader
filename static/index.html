<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suno Piens Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body oncontextmenu="return false;">
  <div class="wrap">
    <nav class="nav">
      <div class="brand">
        <div class="logo">↓</div>
        <div>
          <h1>Suno Piens Downloader</h1>
          <small>Beater Test Free</small>
        </div>
      </div>
      <div class="pill">● Online</div>
    </nav>

    <section class="hero">
      <h2>Download <span>Suno AI</span></h2>
      <p>Tempel link lagu, unduh MP3 / WAV / M4A.</p>
      <form id="downloadForm" class="box">
        <input id="urlInput" type="url" placeholder="suno.com/song/… atau suno.com/s/…" required />
        <button type="button" class="btn btn-ghost" id="pasteBtn">Paste</button>
        <button type="submit" class="btn btn-main" id="fetchBtn">Fetch</button>
      </form>
      <div id="alertBox" class="alert"></div>
    </section>

    <section id="resultCard" class="result card">
      <div class="result-inner">
        <img id="coverImg" alt="cover" />
        <div class="meta">
          <h3 id="songTitle">Title</h3>
          <p class="by" id="songCreator">By:</p>
          <div class="tags" id="songTags"></div>
          <audio id="audioPlayer" controls controlsList="nodownload"></audio>
          <div class="formats">
            <button class="fmt" type="button" onclick="triggerDownload('mp3')"><b>MP3</b><span>320 kbps</span></button>
            <button class="fmt" type="button" onclick="triggerDownload('wav')"><b>WAV</b><span>Lossless</span></button>
            <button class="fmt" type="button" onclick="triggerDownload('m4a')"><b>M4A</b><span>Original</span></button>
          </div>
        </div>
      </div>
    </section>

    <footer class="foot">© 2026 Suno Piens Downloader. All Rights Reserved.</footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
